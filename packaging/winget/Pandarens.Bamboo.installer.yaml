# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
#
# Portable без подписи. Так можно: в каталоге winget неподписанных
# portable-пакетов много — fzf, fd и прочие. Прежняя редакция этого
# манифеста утверждала обратное, и это было неверно.
PackageIdentifier: Pandarens.Bamboo
PackageVersion: 0.9.18
InstallerType: portable
# Установщика у Bamboo нет и не нужно: это один файл, который никуда себя
# не прописывает. Автозапуск включается в самой программе — делать это
# за человека при установке было бы навязчиво.
Commands:
- bamboo
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/Pandarens/Bamboo/releases/download/v0.9.18/bamboo-agent.exe
  InstallerSha256: B95600DA72D6DFD1C232C420285587F897086E1829802C2A9B13E2185BCF5678
ManifestType: installer
ManifestVersion: 1.12.0

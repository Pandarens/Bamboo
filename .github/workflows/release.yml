# Сборка выпуска с подтверждением происхождения (ТЗ, раздел 17).
#
# Ключевое здесь — что сборка идёт ВНУТРИ этого прогона. Подтверждение
# происхождения привязывается к артефакту, произведённому конкретным
# прогоном; файл, собранный на чьей-то машине и залитый руками, подтвердить
# нечем в принципе. Первые беты именно так и собирались, поэтому у них
# провенанса нет и задним числом не появится.
#
# Про подпись — прямо. Её здесь нет: нужен сертификат, а его у проекта нет.
# Самоподписанный не помогает против SmartScreen и Defender и был бы
# плацебо в смысле раздела 11.5. Вместо неё — подтверждение происхождения
# и SHA-256, и в описании выпуска это названо своими именами.

name: Выпуск

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Нужны, чтобы приложить подтверждение происхождения к артефакту.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Сборка и публикация
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш
        uses: Swatinem/rust-cache@v2

      # Проверки перед выпуском те же, что в CI: выпускать несобирающееся
      # или непроходящее тесты нельзя, даже если тег уже поставлен.
      - name: Форматирование
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --workspace

      - name: Сборка
        run: cargo build --release -p bamboo-agent

      - name: Подтверждение происхождения
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release/bamboo-agent.exe

      # Сумму считаем здесь же и кладём рядом: это то, чем человек без
      # GitHub CLI может проверить загрузку.
      - name: Контрольная сумма
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/bamboo-agent.exe -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath sha256.txt -Encoding ascii -NoNewline
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Выпуск
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bamboo-agent.exe
            sha256.txt
          # Предвыпуск определяется по дефису в теге: v0.9.0-beta.1 — бета,
          # v0.9.0 — выпуск. Прежде здесь стояло жёсткое true, и выпуск
          # v0.9.0 не стал бы «Latest» на GitHub — а на «Latest» смотрит
          # и человек, и checkver у scoop.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Сборка из коммита ${{ github.sha }}.

            SHA256: ${{ env.SHA256 }}

            Файл собран этим прогоном и снабжён подтверждением
            происхождения GitHub. Проверить: `gh attestation verify
            bamboo-agent.exe --repo ${{ github.repository }}`.

            Подписи у файла нет — Windows покажет SmartScreen. Это
            решение, а не недоделка: проект открытый и бесплатный,
            сертификат стоит денег, а самоподписанный от SmartScreen
            не спасает — доверие там к репутации издателя, а не к факту
            подписи.

  winget:
    name: Подача в winget
    needs: build
    runs-on: ubuntu-latest
    # Только для окончательных выпусков (по дефису: ловит и beta, и rc) —
    # каталог winget не место для предвыпусков, оттуда ставят не глядя.
    # И только при заведённом секрете: без него шаг упал бы, утянув за
    # собой вид всего прогона, хотя сам выпуск уже опубликован.
    #
    # Первая подача пакета — только руками: это действие умеет лишь
    # обновлять уже существующий в каталоге пакет. Порядок первой подачи
    # описан в packaging/README.md.
    if: ${{ !contains(github.ref_name, '-') && secrets.WINGET_TOKEN != '' }}

    steps:
      - name: Отправить обновление
        # Прибит к версии: плавающий main в шаге, которому доверен личный
        # токен, — приглашение чужому коду в наши секреты.
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Pandarens.Bamboo
          installers-regex: 'bamboo-agent\.exe$'
          # Нужен личный токен с правом public_repo: действие делает
          # копию microsoft/winget-pkgs и открывает туда запрос
          # на слияние. Токен репозитория для чужого репозитория
          # не годится.
          token: ${{ secrets.WINGET_TOKEN }}

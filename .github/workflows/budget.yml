# Проверка ресурсного бюджета (ТЗ, разделы 4 и 16.1).
#
# Сразу о том, чего этот рабочий процесс НЕ делает, чтобы не выдавать его
# за большее. Раздел 16.1 требует суточного прогона, а суточного прогона
# здесь нет и быть не может: раннер GitHub убивает задание на шести часах.
# Настоящий суточный прогон возможен только на своей машине, и пока такой
# машины у проекта нет, этот пункт чеклиста закрыт наполовину — так он
# в PROGRESS.md и помечен.
#
# Что здесь есть и зачем: получасовой прогон раз в сутки. Он не отвечает
# на вопрос «сколько Bamboo пишет на диск за сутки», но ловит то, ради
# чего бюджет вообще заведён, — рост памяти от коммита к коммиту. Утечка
# в резидентной программе видна и на получасе, а обнаруженная через месяц
# на чужой машине обходится куда дороже.

name: Бюджет

on:
  schedule:
    # Раз в сутки. Точность GitHub не гарантирует и пропуски считает
    # нормой — для этой проверки годится: она сравнивает с пределом,
    # а не строит непрерывный ряд.
    - cron: "17 3 * * *"
  # Руками — чтобы можно было проверить подозрительный коммит сразу,
  # а не ждать ночи.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  budget:
    name: Ресурсный бюджет
    runs-on: windows-latest
    # Получас на замер плюс запас на сборку.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш
        uses: Swatinem/rust-cache@v2

      # Обязательно релизная сборка: в отладочной цифры завышены втрое,
      # и сверять их с пределами бессмысленно.
      - name: Сборка
        run: cargo build --release -p bamboo-cli

      - name: Замер
        shell: pwsh
        run: |
          $out = & target\release\bamboo.exe budget --for 1800 2>&1 | Out-String
          Write-Host $out
          $out | Out-File -FilePath budget.txt -Encoding utf8
          # Команда сама сверяет замер с пределами и говорит словами,
          # уложился он или нет. Проверяем её вывод, а не гадаем по числам.
          if ($out -match "ПРЕВЫШЕНИЕ") {
            Write-Error "Ресурсный бюджет превышен — см. вывод выше."
            exit 1
          }

      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: бюджет
          path: budget.txt
          retention-days: 30

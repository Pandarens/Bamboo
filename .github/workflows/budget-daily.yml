# Суточный прогон бюджета на своей машине (ТЗ, разделы 4 и 16.1).
#
# Отдельно от `budget.yml`, и это не дублирование. Тот идёт на раннере
# GitHub, длится полчаса и ловит рост памяти от коммита к коммиту — он
# работает всегда и ни от чего не зависит. Этот требует своего раннера
# и делает то, чего на GitHub сделать нельзя: сутки подряд.
#
# Почему нельзя: у раннера GitHub задание убивается на шести часах.
# У своего предел пять суток.
#
# ## Безопасность
#
# Раннер выполняет код из репозитория на живой машине с правами того,
# кто его поставил. На публичном репозитории это известный риск: pull
# request из чужой копии выполнится у вас дома.
#
# Защита здесь не в настройке, а в устройстве: этот процесс запускается
# **только** по расписанию и вручную. События `pull_request` у него нет
# вовсе, а раннер берёт лишь те задания, которые на него нацелены.
# Значит чужой код до него не дойдёт — при условии, что ни один процесс
# с `pull_request` не получит `runs-on: self-hosted`. Сейчас таких нет:
# `ci.yml` идёт на раннерах GitHub, и так должно остаться.

name: Бюджет за сутки

on:
  schedule:
    # Раз в неделю, ночью с воскресенья на понедельник. Не ежедневно:
    # прогон занимает сутки, а запускать новый поверх идущего незачем.
    - cron: "0 2 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  daily:
    name: Сутки наблюдения
    runs-on: self-hosted
    # Сутки плюс запас на сборку. Больше пяти суток не бывает даже
    # у своего раннера.
    timeout-minutes: 1500

    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      # Обязательно релизная сборка: в отладочной цифры завышены втрое,
      # и сверять их с пределами бессмысленно.
      - name: Сборка
        run: cargo build --release -p bamboo-cli

      - name: Сутки замера
        shell: pwsh
        run: |
          $out = & target\release\bamboo.exe budget --for 86400 2>&1 | Out-String
          Write-Host $out
          $out | Out-File -FilePath budget-daily.txt -Encoding utf8
          if ($out -match "ПРЕВЫШЕНИЕ") {
            Write-Error "Ресурсный бюджет превышен за суточный прогон."
            exit 1
          }

      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: бюджет-за-сутки
          path: budget-daily.txt
          retention-days: 90

[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.9.0-beta.8"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/Pandarens/Bamboo"
authors = ["Pandarens"]

[workspace.dependencies]
# Внутренние крейты — с путём и версией: без версии cargo считает
# зависимость wildcard, а wildcard'ы в резидентной утилите запрещены
# (см. deny.toml).
bamboo-core = { path = "crates/bamboo-core", version = "0.9.0-beta.8" }
bamboo-sys = { path = "crates/bamboo-sys", version = "0.9.0-beta.8" }
bamboo-collect = { path = "crates/bamboo-collect", version = "0.9.0-beta.8" }
bamboo-etw = { path = "crates/bamboo-etw", version = "0.9.0-beta.8" }
bamboo-store = { path = "crates/bamboo-store", version = "0.9.0-beta.8" }
bamboo-analyze = { path = "crates/bamboo-analyze", version = "0.9.0-beta.8" }
bamboo-policy = { path = "crates/bamboo-policy", version = "0.9.0-beta.8" }
bamboo-actuate = { path = "crates/bamboo-actuate", version = "0.9.0-beta.8" }
bamboo-journal = { path = "crates/bamboo-journal", version = "0.9.0-beta.8" }
bamboo-ipc = { path = "crates/bamboo-ipc", version = "0.9.0-beta.8" }

windows-sys = "0.61"

# Резидентная утилита обязана укладываться в ресурсный бюджет (ТЗ, раздел 4),
# поэтому оптимизируем по размеру, а не по скорости.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

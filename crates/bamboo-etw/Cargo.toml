[package]
name = "bamboo-etw"
description = "Трассировка процессов через ETW: видеорегистратор и учёт короткоживущих процессов"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bamboo-core.workspace = true

[target.'cfg(windows)'.dependencies]
bamboo-sys.workspace = true
# Нужен ровно ради типа GUID в сигнатурах: сам ETW живёт в bamboo-sys.
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Etw"] }
[package]
name = "bamboo-service"
description = "Брокер Bamboo: служба SYSTEM, выполняющая привилегированные операции по запросу агента"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bamboo-service"
path = "src/main.rs"

[dependencies]
bamboo-core.workspace = true
bamboo-ipc = { path = "../bamboo-ipc" }
bamboo-policy = { path = "../bamboo-policy" }
bamboo-journal = { path = "../bamboo-journal" }

[target.'cfg(windows)'.dependencies]
bamboo-sys.workspace = true
bamboo-actuate = { path = "../bamboo-actuate" }

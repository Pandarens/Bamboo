[package]
name = "bamboo-cli"
description = "Отладочная утилита Bamboo: снимок системы, топ потребителей, контроль собственного бюджета"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bamboo"
path = "src/main.rs"

[dependencies]
bamboo-core.workspace = true

[dependencies.bamboo-analyze]
path = "../bamboo-analyze"

[dependencies.bamboo-policy]
path = "../bamboo-policy"

[dependencies.bamboo-journal]
path = "../bamboo-journal"

[dependencies.bamboo-actuate]
path = "../bamboo-actuate"

[target.'cfg(windows)'.dependencies]
bamboo-collect.workspace = true
bamboo-etw = { path = "../bamboo-etw" }
bamboo-sys.workspace = true

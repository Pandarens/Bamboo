# Конфигурация cargo-deny (ТЗ, раздел 15.3).
#
# Проверяет три вещи: известные уязвимости, совместимость лицензий
# и дубликаты зависимостей. Резидентная утилита под SYSTEM не имеет права
# тащить непроверенный код.

[advisories]
version = 2
# Отозванные версии и настоящие уязвимости — жёсткая ошибка, и она проверяется
# для всего дерева зависимостей, включая транзитивные.
yanked = "deny"
# «Не развивается» проверяем только для крейтов, которые выбрали мы сами.
# Транзитивные зависимости большого UI-фреймворка (Slint тянет gtk, paste,
# proc-macro-error, rustybuzz, ttf-parser) полицией заброшенности не считаем:
# заменить их мы всё равно не можем, а уязвимости в них ловятся отдельно
# и по-прежнему валят сборку.
unmaintained = "workspace"
ignore = [
    # bincode 1.x — наша прямая зависимость. Формат заморожен, версия много
    # лет стабильна, канал локальный. Переход на 2.0 — вопрос будущего,
    # а не безопасности.
    "RUSTSEC-2025-0141",
]

[licenses]
version = 2
# Проект под GPLv3 (обусловлено Slint). Разрешаем совместимые лицензии.
allow = [
    # Собственные крейты Bamboo объявлены именно так.
    "GPL-3.0-or-later",
    # Slint предлагается под тройной лицензией; мы берём его под GPL,
    # из-за чего и весь проект под GPLv3.
    "GPL-3.0-only",
    "GPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Boost — пермиссивная, совместима с GPL (clipboard-win, error-code).
    "BSL-1.0",
    # NCSA — пермиссивная BSD-подобная, ею лицензирован LLVM (libfuzzer-sys).
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
# Ниже этой уверенности в определении лицензии — считать неопределённой.
confidence-threshold = 0.9

[bans]
# Несколько версий одной библиотеки раздувают бинарник резидентной
# утилиты. Предупреждаем, чтобы держать дерево зависимостей в узде.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Только crates.io. Никакой загрузки кода из произвольных git-репозиториев:
# это канал поставки атак ровно так же, как правила сообщества (ТЗ 15.2).
unknown-registry = "deny"
unknown-git = "deny"
